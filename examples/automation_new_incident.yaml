# Optional example. The same automation is available without any YAML as the
# "Brandweerrooster – melding bij nieuw incident" blueprint.
# Replace the entity ID and notify action with your own.

alias: Brandweerrooster - P1 notification
description: Send a notification when a new P1 incident is detected.
triggers:
  - trigger: state
    entity_id: event.brandweerrooster_nieuw_incident
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state != 'unavailable'
         and trigger.to_state.attributes.event_type == 'p1_incident' }}
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: "🚒 P1 {{ trigger.to_state.attributes.classificatie }}"
      message: >-
        {{ trigger.to_state.attributes.melding }}
        - {{ trigger.to_state.attributes.locatie }}
mode: queued
